apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-app
  namespace: default
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: legacy-app
    spec:
      hostNetwork: true
      containers:
        - name: legacy-app
          image: myregistry.example.com/legacy-app:latest
          imagePullPolicy: Always
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
          livenessProbe:
            httpGet:
              path: /status
              port: 8080
          readinessProbe:
            httpGet:
              path: /status
              port: 8080
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
